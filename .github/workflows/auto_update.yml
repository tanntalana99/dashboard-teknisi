name: Auto Update Data Nucleus Every Hour

on:
  schedule:
    # Jalankan otomatis setiap jam (Menit ke-0)
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan kamu klik "Run Workflow" secara manual kapan saja

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data dari Nucleus [skip ci]" && git push)
