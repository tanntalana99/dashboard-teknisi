<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Performa Teknisi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- HEADER / NAVBAR -->
    <header class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> Dashboard Performa Teknisi
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="openModal()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-file-upload"></i> Upload CSV
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER UTAMA -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- PANEL FILTER -->
        <div class="bg-white p-4 rounded-xl shadow mb-6">
            <h2 class="text-md font-semibold text-gray-700 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-filter"></i> Filter Data
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <!-- Filter Tanggal Mulai -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1">TGL MULAI</label>
                    <input type="date" id="filter-date-start" onchange="renderTable()" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <!-- Filter Tanggal Selesai -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1">TGL SELESAI</label>
                    <input type="date" id="filter-date-end" onchange="renderTable()" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <!-- Filter Area -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1">AREA</label>
                    <select id="filter-area" onchange="updateSektorDropdown(); renderTable();" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">Semua Area</option>
                        <option value="SLT">SLT</option>
                        <option value="SMR">SMR</option>
                        <option value="PWT">PWT</option>
                        <option value="MAG">MAG</option>
                    </select>
                </div>
                <!-- Filter Sektor -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1">SEKTOR</label>
                    <select id="filter-sektor" onchange="renderTable()" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">Semua Sektor</option>
                    </select>
                </div>
                <!-- Pencarian Teknisi -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1">CARI TEKNISI</label>
                    <input type="text" id="search-input" onkeyup="renderTable()" placeholder="Ketik nama..." class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="mt-4 flex justify-between items-center pt-3 border-t">
                <button onclick="resetFilters()" class="text-sm text-gray-500 hover:text-red-600 transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i> Reset Filter
                </button>
                <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> Download Excel (Detail)
                </button>
            </div>
        </div>

        <!-- TABEL DATA RINGKASAN PERFORMA -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-indigo-50 text-indigo-900 border-b font-semibold">
                            <th class="p-3">TEKNISI</th>
                            <th class="p-3">SEKTOR</th>
                            <th class="p-3 text-center">SQM</th>
                            <th class="p-3 text-center">REGULER</th>
                            <th class="p-3 text-center">INSERA</th>
                            <th class="p-3 text-center">UNDERSPEC</th>
                            <th class="p-3 text-center">GRAND TOTAL</th>
                            <th class="p-3 text-center">TARGET 70%</th>
                            <th class="p-3 text-center">TARGET 100%</th>
                            <th class="p-3 text-center">% CAPAIAN</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="10" class="text-center py-6 text-gray-400">Memuat data dari database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL UPLOAD CSV -->
    <div id="upload-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">Upload File CSV Rekap</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>

            <!-- Form File -->
            <div class="mb-4">
                <input type="file" id="csv-file-input" accept=".csv, .txt" onchange="handleFileSelect(event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border rounded-lg">
            </div>

            <!-- Info File -->
            <div id="file-info-section" class="mb-4 p-3 bg-gray-50 rounded-lg hidden text-sm">
                <p class="text-gray-600">Jumlah data terbaca: <strong id="info-count" class="text-indigo-600">0</strong> tiket</p>
            </div>

            <!-- Opsi Mode Upload -->
            <div id="mode-selection-section" class="mb-6 hidden text-sm">
                <label class="block text-gray-700 font-semibold mb-2">Pilih Mode Simpan:</label>
                <div class="space-y-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="upload-mode" value="replace" checked class="text-indigo-600 focus:ring-indigo-500">
                        <span>Ganti Semua Data (Replace)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="upload-mode" value="append" class="text-indigo-600 focus:ring-indigo-500">
                        <span>Tambah Data Baru (Append)</span>
                    </label>
                </div>
            </div>

            <!-- Tombol Modal -->
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-100">Batal</button>
                <button id="btn-submit" onclick="submitData()" disabled class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50">
                    Update Dashboard Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA DASHBOARD & SUPABASE -->
    <script>
    // Konfigurasi Supabase REST API
    const SUPABASE_URL = "https://xphudssbidvymyxheeav.supabase.co/rest/v1/dataupload";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwaHVkc3NiaWR2eW15eGhlZWF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzgzOTYsImV4cCI6MjA1NTc1NDM5Nn0.bC3-x23BJS_BvP3Yv1-qD--9PZzZInA2cQ72f3d6m_U";

    // Mapping Sektor ke Area
    const areaMapping = {
        "SLT": ["SLO", "BYL", "KLT", "SRG", "KAR", "WON"],
        "SMR": ["SLT", "SMR", "KND", "UNG", "PRG"],
        "PWT": ["PWT", "CLP", "PBG", "PBA"],
        "MAG": ["MAG", "MGG", "TEM", "PUR", "WNS"]
    };

    let rawTickets = [];
    let pendingParsedTickets = [];
    let isLoggedIn = true;

    // 1. HELPER PARSING TANGGAL
    function parseDateString(dateStr) {
        if (!dateStr) return null;
        let cleanStr = dateStr.trim().split(' ')[0];
        
        if (cleanStr.includes('/')) {
            const parts = cleanStr.split('/');
            if (parts.length === 3) {
                const day = parts[0].padStart(2, '0');
                const month = parts[1].padStart(2, '0');
                const year = parts[2];
                return `${year}-${month}-${day}`;
            }
        }
        if (cleanStr.includes('-')) {
            return cleanStr;
        }
        return null;
    }

    // 2. PEMBACAAN DATA DARI SUPABASE
    async function loadDataFromSupabase() {
        try {
            let allData = [];
            let page = 0;
            const pageSize = 1000;
            let hasMore = true;

            while (hasMore) {
                const from = page * pageSize;
                const to = from + pageSize - 1;

                const response = await fetch(`${SUPABASE_URL}?select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Range': `${from}-${to}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    allData = allData.concat(data);

                    if (data.length < pageSize) {
                        hasMore = false;
                    } else {
                        page++;
                    }
                } else {
                    console.error("Gagal mengambil data Supabase", await response.text());
                    hasMore = false;
                }
            }

            rawTickets = allData.map(item => ({
                teknisi: item.teknisi || '-',
                sektor: item.sektor || '-',
                jenis: item.jenis || 'REGULER',
                date: item.tanggal || null,
                tiket: item.tiket || '',
                nomor_inet: item.nomor_inet || '',
                nik: item.nik || '',
                perbaikan: item.perbaikan || ''
            }));

            updateSektorDropdown();
            renderTable();

        } catch (err) {
            console.error("Error fetching data:", err);
        }
    }

    // 3. PARSING FILE CSV (MENYELURUH)
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            parseCSVText(e.target.result);
        };
        reader.readAsText(file);
    }

    function parseCSVText(csvText) {
        const lines = csvText.split(/\r\n|\n/);
        if (lines.length < 2) {
            alert("File CSV kosong!");
            return;
        }

        let headerLineIndex = -1;
        let delimiter = ';';
        
        let techColIndex = -1;
        let jenisColIndex = -1;
        let sektorColIndex = -1;
        let dateColIndex = -1;
        let tiketColIndex = -1;
        let inetColIndex = -1;
        let nikColIndex = -1;
        let perbaikanColIndex = -1;

        for (let i = 0; i < Math.min(lines.length, 15); i++) {
            let line = lines[i].toUpperCase();
            if (line.includes("TEKNISI") || line.includes("NAMA")) {
                headerLineIndex = i;
                delimiter = line.includes(";") ? ";" : ",";

                let cols = lines[i].split(delimiter).map(c => c.replace(/"/g, '').trim().toUpperCase());
                cols.forEach((col, idx) => {
                    if (col.includes("TEKNISI") || col.includes("NAMA")) techColIndex = idx;
                    if (col === "JENIS" || col.includes("JENIS")) jenisColIndex = idx;
                    if (col.includes("SEKTOR") || col.includes("STO") || col.includes("AREA")) sektorColIndex = idx;
                    if (col.includes("TGL") || col.includes("TANGGAL") || col.includes("DATE")) dateColIndex = idx;
                    if (col.includes("TIKET")) tiketColIndex = idx;
                    if (col.includes("INET") || col.includes("NOMOR INET")) inetColIndex = idx;
                    if (col.includes("NIK")) nikColIndex = idx;
                    if (col.includes("KETERANGAN") || col.includes("PERBAIKAN")) perbaikanColIndex = idx;
                });
                break;
            }
        }

        if (headerLineIndex === -1 || techColIndex === -1) {
            alert("Format file CSV tidak dikenali. Pastikan file rekap memiliki kolom 'TEKNISI'.");
            return;
        }

        pendingParsedTickets = [];

        for (let i = headerLineIndex + 1; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            let cols = line.split(delimiter).map(c => c.replace(/^"|"$/g, '').trim());
            if (!cols[techColIndex]) continue;

            let name = cols[techColIndex].trim();
            if (!name || name.toUpperCase().includes("GRAND TOTAL") || name.toUpperCase().includes("TOTAL")) continue;

            let jenis = (jenisColIndex !== -1 && cols[jenisColIndex]) ? cols[jenisColIndex].toUpperCase() : "REGULER";
            let sektor = (sektorColIndex !== -1 && cols[sektorColIndex]) ? cols[sektorColIndex].toUpperCase() : "-";
            let dateStr = (dateColIndex !== -1 && cols[dateColIndex]) ? parseDateString(cols[dateColIndex]) : null;
            let tiket = (tiketColIndex !== -1 && cols[tiketColIndex]) ? cols[tiketColIndex] : "";
            let inet = (inetColIndex !== -1 && cols[inetColIndex]) ? cols[inetColIndex] : "";
            let nik = (nikColIndex !== -1 && cols[nikColIndex]) ? cols[nikColIndex] : "";
            let perbaikan = (perbaikanColIndex !== -1 && cols[perbaikanColIndex]) ? cols[perbaikanColIndex] : "";

            pendingParsedTickets.push({
                teknisi: name,
                sektor: sektor,
                jenis: jenis,
                date: dateStr,
                tiket: tiket,
                nomor_inet: inet,
                nik: nik,
                perbaikan: perbaikan
            });
        }

        document.getElementById('file-info-section').classList.remove('hidden');
        document.getElementById('mode-selection-section').classList.remove('hidden');
        document.getElementById('info-count').innerText = pendingParsedTickets.length;
        document.getElementById('btn-submit').disabled = false;
    }

    // 4. SIMPAN DATA KE SUPABASE
    async function submitData() {
        if (!isLoggedIn) return;
        if (pendingParsedTickets.length === 0) {
            alert("Tidak ada data yang terbaca dari CSV.");
            return;
        }

        const btnSubmit = document.getElementById('btn-submit');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

        const mode = document.querySelector('input[name="upload-mode"]:checked').value;

        try {
            if (mode === 'replace') {
                await fetch(`${SUPABASE_URL}?id=gt.0`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
            }

            const payload = pendingParsedTickets.map(t => ({
                teknisi: t.teknisi,
                sektor: t.sektor,
                jenis: t.jenis,
                tanggal: t.date ? t.date : null,
                tiket: t.tiket || null,
                nomor_inet: t.nomor_inet || null,
                nik: t.nik || null,
                perbaikan: t.perbaikan || null
            }));

            const batchSize = 500;
            for (let i = 0; i < payload.length; i += batchSize) {
                const chunk = payload.slice(i, i + batchSize);
                await fetch(SUPABASE_URL, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(chunk)
                });
            }

            await loadDataFromSupabase();
            closeModal();
            alert("Data detail berhasil tersimpan ke Supabase!");
        } catch (err) {
            console.error("Error submitting data:", err);
            alert("Gagal menyimpan data ke database!");
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i class="fa-solid fa-sync"></i> Update Dashboard Sekarang`;
        }
    }

    // 5. RENDER TABEL UTAMA (REKAP PERFORMA)
    function renderTable() {
        const startDate = document.getElementById('filter-date-start').value;
        const endDate = document.getElementById('filter-date-end').value;
        const selectedArea = document.getElementById('filter-area').value;
        const selectedSektor = document.getElementById('filter-sektor').value;
        const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();

        const map = {};

        rawTickets.forEach(t => {
            if (t.date) {
                if (startDate && t.date < startDate) return;
                if (endDate && t.date > endDate) return;
            }

            if (selectedSektor !== 'ALL' && t.sektor !== selectedSektor) return;

            if (selectedArea !== 'ALL') {
                const allowedSectors = areaMapping[selectedArea] || [];
                if (!allowedSectors.includes(t.sektor)) return;
            }

            if (searchQuery && !t.teknisi.toLowerCase().includes(searchQuery)) return;

            const key = t.teknisi;
            if (!map[key]) {
                map[key] = {
                    teknisi: t.teknisi,
                    sektor: t.sektor,
                    sqm: 0,
                    reguler: 0,
                    insera: 0,
                    underspec: 0
                };
            }

            const j = (t.jenis || '').toUpperCase();
            if (j.includes('SQM')) map[key].sqm++;
            else if (j.includes('INSERA')) map[key].insera++;
            else if (j.includes('UNDERSPEC')) map[key].underspec++;
            else map[key].reguler++;
        });

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        const keys = Object.keys(map);
        if (keys.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" class="text-center py-6 text-gray-400">Tidak ada data ditemukan sesuai filter.</td></tr>`;
            return;
        }

        keys.forEach(k => {
            const d = map[k];
            const grandTotal = d.sqm + d.reguler + d.insera + d.underspec;
            const target70 = 35;
            const target100 = 50;
            const pct = (grandTotal / target100) * 100;

            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 border-b";
            tr.innerHTML = `
                <td class="p-3 font-medium">${d.teknisi}</td>
                <td class="p-3">${d.sektor}</td>
                <td class="p-3 text-center">${d.sqm}</td>
                <td class="p-3 text-center">${d.reguler}</td>
                <td class="p-3 text-center">${d.insera}</td>
                <td class="p-3 text-center">${d.underspec}</td>
                <td class="p-3 text-center font-bold text-indigo-600">${grandTotal}</td>
                <td class="p-3 text-center text-gray-500">${target70}</td>
                <td class="p-3 text-center text-gray-500">${target100}</td>
                <td class="p-3 text-center font-semibold ${pct >= 100 ? 'text-green-600' : 'text-amber-600'}">${pct.toFixed(1)}%</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 6. UPDATE DROPDOWN SEKTOR
    function updateSektorDropdown() {
        const selectedArea = document.getElementById('filter-area').value;
        const sektorSelect = document.getElementById('filter-sektor');
        
        let sectors = new Set();

        if (selectedArea !== 'ALL') {
            (areaMapping[selectedArea] || []).forEach(s => sectors.add(s));
        } else {
            rawTickets.forEach(t => { if (t.sektor && t.sektor !== '-') sectors.add(t.sektor); });
        }

        sektorSelect.innerHTML = `<option value="ALL">Semua Sektor</option>`;
        Array.from(sectors).sort().forEach(s => {
            sektorSelect.innerHTML += `<option value="${s}">${s}</option>`;
        });
    }

    // 7. EXPORT EXCEL (DETAIL SESUAI FILTER)
    function exportExcel() {
        const startDate = document.getElementById('filter-date-start').value;
        const endDate = document.getElementById('filter-date-end').value;
        const selectedArea = document.getElementById('filter-area').value;
        const selectedSektor = document.getElementById('filter-sektor').value;
        const searchQuery = document.getElementById('search-input').value.trim();

        const isFiltered = startDate || endDate || selectedArea !== 'ALL' || selectedSektor !== 'ALL' || searchQuery !== '';

        if (!isFiltered) {
            const confirmDownload = confirm("Anda belum memfilter data, apakah akan lanjut download semua data dalam 3 bulan terakhir?");
            if (!confirmDownload) return;
        }

        let filteredTickets = rawTickets.filter(t => {
            if (t.date) {
                if (startDate && t.date < startDate) return false;
                if (endDate && t.date > endDate) return false;
            }

            if (searchQuery && !t.teknisi.toLowerCase().includes(searchQuery.toLowerCase())) return false;
            if (selectedSektor !== 'ALL' && t.sektor !== selectedSektor) return false;

            if (selectedArea !== 'ALL') {
                const allowedSectors = areaMapping[selectedArea] || [];
                if (!allowedSectors.includes(t.sektor)) return false;
            }

            return true;
        });

        if (filteredTickets.length === 0) {
            alert("Tidak ada detail data tiket yang tersedia untuk diunduh sesuai filter saat ini.");
            return;
        }

        const exportData = filteredTickets.map((t, index) => {
            let formattedDate = t.date || '';
            if (t.date && t.date.includes('-')) {
                const [year, month, day] = t.date.split('-');
                formattedDate = `${day}/${month}/${year}`;
            }

            return {
                "NO": index + 1,
                "JENIS": t.jenis || 'REGULER',
                "TIKET": t.tiket || '-',
                "NOMOR INET": t.nomor_inet || '-',
                "SEKTOR": t.sektor || '-',
                "TEKNISI": t.teknisi || '-',
                "NIK": t.nik || '-',
                "PERBAIKAN": t.perbaikan || '-',
                "TGL": formattedDate
            };
        });

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Detail Tiket");

        let fileName = "Detail_Tiket_Teknisi";
        if (startDate || endDate) {
            fileName += `_${startDate || 'awal'}_sbd_${endDate || 'akhir'}`;
        }
        fileName += ".xlsx";

        XLSX.writeFile(wb, fileName);
    }

    // 8. UTILITAS MODAL & RESET
    function openModal() {
        document.getElementById('upload-modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('upload-modal').classList.add('hidden');
        document.getElementById('csv-file-input').value = '';
        document.getElementById('file-info-section').classList.add('hidden');
        document.getElementById('mode-selection-section').classList.add('hidden');
        document.getElementById('btn-submit').disabled = true;
    }

    function resetFilters() {
        document.getElementById('filter-date-start').value = '';
        document.getElementById('filter-date-end').value = '';
        document.getElementById('filter-area').value = 'ALL';
        document.getElementById('search-input').value = '';
        updateSektorDropdown();
        renderTable();
    }

    // Inisialisasi awal
    document.addEventListener('DOMContentLoaded', () => {
        loadDataFromSupabase();
