<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Performa Teknisi - Live Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .rank-1 { background-color: #86efac; color: #064e3b; font-weight: bold; }
        .rank-2 { background-color: #bbf7d0; color: #064e3b; font-weight: bold; }
        .rank-mid { background-color: #fef08a; color: #713f12; font-weight: bold; }
        .rank-low { background-color: #fca5a5; color: #7f1d1d; font-weight: bold; }
        .zebra-even { background-color: #ffffff; }
        .zebra-odd { background-color: #f8fafc; }
        .zebra-even:hover, .zebra-odd:hover { background-color: #f1f5f9; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">

        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white rounded-xl p-6 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-chart-line"></i> Dashboard Performa Teknisi
                </h1>
                <p class="text-blue-200 text-sm mt-1 flex items-center gap-2">
                    <span id="sync-status-indicator" class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block animate-pulse"></span>
                    <span id="sync-status-text">Menghubungkan ke Google Sheets...</span>
                </p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="fetchLiveData()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg shadow font-medium text-xs flex items-center gap-2 transition">
                    <i class="fa-solid fa-rotate" id="refresh-icon"></i> Refresh Data
                </button>
                <button onclick="openAreaModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-lg shadow font-medium text-xs flex items-center gap-2 transition">
                    <i class="fa-solid fa-layer-group"></i> Kelola Mapping Area
                </button>
                <button onclick="exportExcel()" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2.5 rounded-lg shadow font-medium text-xs flex items-center gap-2 transition">
                    <i class="fa-solid fa-file-excel"></i> Export Excel
                </button>
            </div>
        </div>

        <!-- KPI Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-users"></i></div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Total Teknisi</div>
                    <div id="stat-total-teknisi" class="text-2xl font-bold text-slate-800">0</div>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-ticket"></i></div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Total Tiket</div>
                    <div id="stat-total-tiket" class="text-2xl font-bold text-slate-800">0</div>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-trophy"></i></div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Top Performer</div>
                    <div id="stat-top-performer" class="text-lg font-bold text-slate-800 truncate max-w-[150px]">-</div>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-chart-pie"></i></div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Rata-rata % Target</div>
                    <div id="stat-avg-target" class="text-2xl font-bold text-slate-800">0%</div>
                </div>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <label class="text-xs font-bold text-slate-600 uppercase"><i class="fa-solid fa-map-location-dot text-amber-600"></i> Area:</label>
                    <select id="filter-area" onchange="renderTable()" class="px-3 py-2 border rounded-lg text-sm bg-white font-medium text-slate-700">
                        <option value="ALL">-- SEMUA AREA --</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto">
                    <label class="text-xs font-bold text-slate-600 uppercase"><i class="fa-solid fa-filter text-blue-600"></i> Sektor:</label>
                    <select id="filter-sektor" onchange="renderTable()" class="px-3 py-2 border rounded-lg text-sm bg-white font-medium text-slate-700">
                        <option value="ALL">-- SEMUA SEKTOR --</option>
                    </select>
                </div>

                <div class="relative w-full md:w-56">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="renderTable()" placeholder="Cari teknisi..." class="w-full pl-10 pr-4 py-2 border rounded-lg text-sm">
                </div>
            </div>
        </div>

        <!-- Main Data Table -->
        <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-200 text-slate-800 font-bold border-b border-slate-300 text-center uppercase tracking-wider">
                            <th class="p-3 text-left min-w-[200px]">TEKNISI</th>
                            <th class="p-3 min-w-[80px]">SEKTOR</th>
                            <th class="p-3 min-w-[80px]">SQM</th>
                            <th class="p-3 min-w-[80px]">REGULER</th>
                            <th class="p-3 min-w-[80px]">INSERA</th>
                            <th class="p-3 min-w-[100px]">UNDERSPEC</th>
                            <th class="p-3 bg-slate-300 min-w-[100px]">Grand Total</th>
                            <th class="p-3 bg-emerald-100 text-emerald-900 min-w-[70px]">RANK</th>
                            <th class="p-3 bg-slate-100 min-w-[110px]">TARGET 70%<br><span class="text-[10px] font-normal text-slate-600">= 62 TIKET</span></th>
                            <th class="p-3 bg-slate-100 min-w-[110px]">TARGET 100%<br><span class="text-[10px] font-normal text-slate-600">= 88 TIKET</span></th>
                            <th class="p-3 bg-blue-100 text-blue-900 min-w-[90px]">%</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                    <tfoot id="table-foot" class="bg-slate-200 font-bold border-t-2 border-slate-400"></tfoot>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SPREADSHEET_ID = "1KlgbcBoN6Exq4VgJW_WQixf3-i4oLv1t0K4MIj71yHg";
        const GOOGLE_SHEETS_GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

        let dataset = [];
        let areaMapping = JSON.parse(localStorage.getItem('areaMapping_v1')) || {
            'GLADAK': ['GLD', 'GLD1', 'GLD2', 'SLO'],
            'KARTASURA': ['KRT1', 'KRT2', 'KRT3', 'KRT4'],
            'SOLO KOTA': ['KTO', 'SKH', 'SOP']
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateAreaDropdown();
            fetchLiveData();
        });

        window.google = window.google || {};
        window.google.visualization = window.google.visualization || {};
        window.google.visualization.Query = {
            setResponse: function(response) {
                if (response && response.table) {
                    parseGVizData(response.table);
                    document.getElementById('sync-status-text').innerText = "Terhubung (Data Lengkap Sync)";
                    document.getElementById('sync-status-indicator').className = "w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block";
                }
                document.getElementById('refresh-icon').classList.remove('fa-spin');
            }
        };

        function fetchLiveData() {
            document.getElementById('refresh-icon').classList.add('fa-spin');
            const script = document.createElement('script');
            script.src = GOOGLE_SHEETS_GVIZ_URL + "&t=" + new Date().getTime();
            document.body.appendChild(script);
        }

        // FUNGSI UTAMA: MENGAMBIL HANYA KOLOM PENTING & DETEKSI HEADER DENGAN PRESISI
        function parseGVizData(table) {
            const rows = table.rows;
            if (!rows || rows.length === 0) return;

            let techIndex = -1, jenisIndex = -1, sektorIndex = -1;

            // 1. Cari letak pasti posisi kolom TEKNISI, JENIS, dan SEKTOR
            for (let i = 0; i < rows.length; i++) {
                if (!rows[i].c) continue;
                let rowVals = rows[i].c.map(cell => cell && cell.v !== null ? String(cell.v).toUpperCase().trim() : '');

                let tIdx = rowVals.findIndex(v => v === 'TEKNISI');
                let jIdx = rowVals.findIndex(v => v === 'JENIS');
                let sIdx = rowVals.findIndex(v => v === 'SEKTOR');

                if (tIdx !== -1) {
                    techIndex = tIdx;
                    jenisIndex = jIdx;
                    sektorIndex = sIdx;
                    break;
                }
            }

            // Fallback default index jika header tersembunyi
            if (techIndex === -1) { techIndex = 5; jenisIndex = 1; sektorIndex = 4; }

            let techMap = {};

            // 2. Olah data baris demi baris secara rapi
            for (let i = 0; i < rows.length; i++) {
                let r = rows[i];
                if (!r || !r.c) continue;

                let name = r.c[techIndex] && r.c[techIndex].v !== null ? String(r.c[techIndex].v).trim() : '';

                // Filter agar baris judul / total / kosong tidak terikut
                if (!name || name.toUpperCase() === "TEKNISI" || name.toUpperCase().includes("TOTAL") || name.toUpperCase().includes("REKAP")) continue;

                let jenis = (jenisIndex !== -1 && r.c[jenisIndex] && r.c[jenisIndex].v !== null) ? String(r.c[jenisIndex].v).toUpperCase().trim() : "REGULER";
                let sektor = (sektorIndex !== -1 && r.c[sektorIndex] && r.c[sektorIndex].v !== null) ? String(r.c[sektorIndex].v).toUpperCase().trim() : "-";

                let key = name.toUpperCase();

                if (!techMap[key]) {
                    techMap[key] = { teknisi: name, sektor: sektor, sqm: 0, reguler: 0, insera: 0, underspec: 0 };
                }

                if (sektor !== '-' && techMap[key].sektor === '-') techMap[key].sektor = sektor;

                if (jenis.includes("SQM")) techMap[key].sqm++;
                else if (jenis.includes("INSERA")) techMap[key].insera++;
                else if (jenis.includes("UNDERSPEC")) techMap[key].underspec++;
                else techMap[key].reguler++;
            }

            dataset = Object.values(techMap);
            updateSektorDropdown();
            renderTable();
        }

        function calculateBaseData(dataList) {
            return dataList.map(item => {
                let sqm = Number(item.sqm) || 0;
                let reguler = Number(item.reguler) || 0;
                let insera = Number(item.insera) || 0;
                let underspec = Number(item.underspec) || 0;
                let grandTotal = sqm + reguler + insera + underspec;

                let target70 = grandTotal - 62;
                let target100 = grandTotal - 88;
                let pct = (grandTotal / 88) * 100;

                return { ...item, sqm, reguler, insera, underspec, grandTotal, target70, target100, pct };
            });
        }

        function renderTable() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedArea = document.getElementById('filter-area').value;
            const selectedSektor = document.getElementById('filter-sektor').value;

            const baseData = calculateBaseData(dataset);

            let filtered = baseData.filter(item => {
                const matchesSearch = item.teknisi.toLowerCase().includes(searchQuery);
                const matchesSektor = (selectedSektor === 'ALL') || (item.sektor === selectedSektor);

                let matchesArea = true;
                if (selectedArea !== 'ALL') {
                    const allowedSectors = areaMapping[selectedArea] || [];
                    matchesArea = allowedSectors.includes(item.sektor);
                }

                return matchesSearch && matchesSektor && matchesArea;
            });

            filtered.sort((a, b) => b.grandTotal - a.grandTotal);

            let currentRank = 1;
            for (let i = 0; i < filtered.length; i++) {
                if (i > 0 && filtered[i].grandTotal < filtered[i - 1].grandTotal) currentRank = i + 1;
                filtered[i].rank = currentRank;
            }

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            let sumSqm = 0, sumReguler = 0, sumInsera = 0, sumUnderspec = 0, sumGrandTotal = 0;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-8 text-center text-slate-400">Data tidak ditemukan.</td></tr>`;
            } else {
                filtered.forEach((row, index) => {
                    sumSqm += row.sqm;
                    sumReguler += row.reguler;
                    sumInsera += row.insera;
                    sumUnderspec += row.underspec;
                    sumGrandTotal += row.grandTotal;

                    let rankClass = row.rank === 1 ? 'rank-1' : (row.rank <= 3 ? 'rank-2' : (row.rank <= 10 ? 'rank-mid' : 'rank-low'));

                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'zebra-even text-center' : 'zebra-odd text-center';
                    tr.innerHTML = `
                        <td class="p-3 text-left font-semibold text-slate-800 border-b">${row.teknisi}</td>
                        <td class="p-3 font-semibold text-slate-600 border-b">${row.sektor || '-'}</td>
                        <td class="p-3 border-b">${row.sqm || ''}</td>
                        <td class="p-3 border-b font-medium">${row.reguler || ''}</td>
                        <td class="p-3 border-b">${row.insera || ''}</td>
                        <td class="p-3 border-b">${row.underspec || ''}</td>
                        <td class="p-3 border-b font-bold bg-slate-50">${row.grandTotal}</td>
                        <td class="p-3 border-b ${rankClass}">${row.rank}</td>
                        <td class="p-3 border-b text-slate-700">${row.target70}</td>
                        <td class="p-3 border-b text-slate-700">${row.target100}</td>
                        <td class="p-3 border-b font-bold text-blue-700">${row.pct.toFixed(2).replace('.', ',')}%</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            const tfoot = document.getElementById('table-foot');
            let sumTarget70 = sumGrandTotal - (filtered.length * 62);
            let sumTarget100 = sumGrandTotal - (filtered.length * 88);
            let overallPct = filtered.length > 0 ? (sumGrandTotal / (filtered.length * 88)) * 100 : 0;

            tfoot.innerHTML = `
                <tr class="text-center">
                    <td class="p-3 text-left" colspan="2">Grand Total (${filtered.length} Teknisi)</td>
                    <td class="p-3">${sumSqm}</td>
                    <td class="p-3">${sumReguler}</td>
                    <td class="p-3">${sumInsera}</td>
                    <td class="p-3">${sumUnderspec}</td>
                    <td class="p-3 bg-slate-300 text-slate-900">${sumGrandTotal}</td>
                    <td class="p-3 bg-slate-300">-</td>
                    <td class="p-3">${sumTarget70}</td>
                    <td class="p-3">${sumTarget100}</td>
                    <td class="p-3 bg-blue-200 text-blue-900">${overallPct.toFixed(2).replace('.', ',')}%</td>
                </tr>
            `;

            document.getElementById('stat-total-teknisi').innerText = filtered.length;
            document.getElementById('stat-total-tiket').innerText = sumGrandTotal;
            document.getElementById('stat-top-performer').innerText = filtered.length > 0 ? filtered[0].teknisi : '-';
            document.getElementById('stat-avg-target').innerText = overallPct.toFixed(1).replace('.', ',') + '%';
        }

        function updateAreaDropdown() {
            const areaSelect = document.getElementById('filter-area');
            areaSelect.innerHTML = `<option value="ALL">-- SEMUA AREA --</option>`;
            Object.keys(areaMapping).sort().forEach(area => {
                const opt = document.createElement('option');
                opt.value = area;
                opt.innerText = area;
                areaSelect.appendChild(opt);
            });
        }

        function updateSektorDropdown() {
            const sektorSelect = document.getElementById('filter-sektor');
            let sektorSet = new Set();
            dataset.forEach(item => { if (item.sektor && item.sektor !== '-') sektorSet.add(item.sektor); });

            sektorSelect.innerHTML = `<option value="ALL">-- SEMUA SEKTOR --</option>`;
            Array.from(sektorSet).sort().forEach(sektor => {
                const opt = document.createElement('option');
                opt.value = sektor;
                opt.innerText = sektor;
                sektorSelect.appendChild(opt);
            });
        }
    </script>
</body>
</html>
